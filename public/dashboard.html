<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>JHON YTB - Dashboard</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0a0a0a">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app-container">
        <header class="app-header">
            <div class="header-left">
                <h1 class="logo">JHON YTB</h1>
            </div>
            <div class="header-right" id="userProfile">
                <div class="profile-info-header">
                    <span class="profile-name" id="profileName"></span>
                    <img src="https://i.pinimg.com/736x/ea/fb/1a/eafb1a29da1c80bfe124d60d7f9a58ed.jpg" alt="Profile" class="profile-avatar" id="profileAvatar">
                </div>
            </div>
        </header>
        
        <main class="main-content">
            <div class="card converter-card">
                <div class="card-title">YouTube Downloader</div>
                <div class="input-group">
                    <input type="text" id="urlInput" class="input-url" placeholder="Paste YouTube link here...">
                    <div class="input-actions">
                        <button class="btn-icon" onclick="pasteLink()" title="Paste">📋</button>
                        <button class="btn-icon" onclick="clearLink()" title="Clear">✖</button>
                    </div>
                </div>
                <div class="type-group">
                    <button class="type-option active" data-type="mp4" onclick="selectType('mp4')">Video MP4</button>
                    <button class="type-option" data-type="mp3" onclick="selectType('mp3')">Audio MP3</button>
                </div>
                <button id="convertBtn" onclick="convertVideo()" class="btn btn-convert">Convert Now</button>
            </div>
            
            <div id="loadingState" class="loading-card hidden">
                <div class="loading-spinner"></div>
                <p>Processing...</p>
            </div>
            
            <div id="errorState" class="error-card hidden">
                <div class="error-icon">⚠</div>
                <p id="errorMessage"></p>
            </div>
            
            <div id="videoInfo" class="video-info-card hidden"></div>
            
            <div id="resultsContainer" class="results-container hidden"></div>
            
            <div class="card guide-card">
                <div class="card-title">Panduan</div>
                <div class="guide-list">
                    <div class="guide-item">1. Salin link video YouTube</div>
                    <div class="guide-item">2. Tempelkan link di kolom URL</div>
                    <div class="guide-item">3. Pilih Video MP4 atau Audio MP3</div>
                    <div class="guide-item">4. Klik Convert Now</div>
                    <div class="guide-item">5. Pilih kualitas, klik Download</div>
                </div>
            </div>
        </main>
    </div>
    
    <script src="script.js"></script>
</body>
</html>
