<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>JHON YTB - YouTube Downloader</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#000000">
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600;14..32,700;14..32,800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body class="login-body">
    <div class="login-wrapper">
        <!-- Splash Layer 1: Website Name (3 detik) -->
        <div class="splash-overlay" id="splashWeb">
            <div class="splash-card">
                <h1 class="splash-title">JHON YTB</h1>
                <div class="splash-progress"></div>
            </div>
        </div>
        
        <!-- Splash Layer 2: Developer Name (2 detik) -->
        <div class="splash-overlay hidden" id="splashDev">
            <div class="splash-card">
                <div class="dev-tag">
                    <span class="dev-bracket">&lt;</span>
                    <span class="dev-name">JHON338</span>
                    <span class="dev-bracket">/&gt;</span>
                </div>
                <div class="splash-progress"></div>
                <p class="dev-status">system_ready.exe</p>
            </div>
        </div>
        
        <!-- Login Form -->
        <div class="login-panel hidden" id="loginPanel">
            <div class="login-header">
                <div class="login-icon">🎧</div>
                <h2>ACCESS SYSTEM</h2>
                <p>YouTube Downloader</p>
            </div>
            <div class="login-body-form">
                <input type="text" id="username" class="input-field" placeholder="USERNAME" autocomplete="off">
                <button onclick="loginUser()" class="btn btn-primary btn-block">→ ENTER</button>
                <small class="demo-text">* Masukkan username apapun</small>
            </div>
        </div>
    </div>

    <script>
        const splashWeb = document.getElementById('splashWeb');
        const splashDev = document.getElementById('splashDev');
        const loginPanel = document.getElementById('loginPanel');
        
        if (localStorage.getItem('jhon_user')) {
            window.location.href = 'dashboard.html';
        }
        
        // 3 detik pertama (Nama Website)
        setTimeout(() => {
            splashWeb.classList.add('fade-out');
            setTimeout(() => {
                splashWeb.classList.add('hidden');
                splashDev.classList.remove('hidden');
                splashDev.classList.add('fade-in');
                
                // 2 detik kedua (Nama Developer)
                setTimeout(() => {
                    splashDev.classList.add('fade-out');
                    setTimeout(() => {
                        splashDev.classList.add('hidden');
                        loginPanel.classList.remove('hidden');
                        loginPanel.classList.add('fade-in');
                    }, 300);
                }, 2000);
            }, 300);
        }, 3000);
        
        function loginUser() {
            const username = document.getElementById('username').value.trim();
            if (username) {
                localStorage.setItem('jhon_user', username);
                window.location.href = 'dashboard.html';
            }
        }
    </script>
</body>
</html>
