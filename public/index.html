<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>JHON YTB - Login</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0a0a0a">
    <link rel="stylesheet" href="style.css">
</head>
<body class="login-body">
    <div class="login-wrapper">
        <div class="splash-overlay" id="splashWeb">
            <div class="splash-card">
                <h1 class="splash-title">JHON YTB</h1>
                <div class="splash-progress"></div>
            </div>
        </div>
        
        <div class="splash-overlay hidden" id="splashDev">
            <div class="splash-card">
                <div class="dev-tag">
                    <span class="dev-bracket">⟨</span>
                    <span class="dev-name">JHON338</span>
                    <span class="dev-bracket">⟩</span>
                </div>
                <div class="splash-progress"></div>
                <p class="dev-status">system_ready</p>
            </div>
        </div>
        
        <div class="login-panel hidden" id="loginPanel">
            <div class="login-header">
                <div class="login-icon">▶</div>
                <h2>Access System</h2>
                <p>YouTube Downloader</p>
            </div>
            <div class="login-body-form">
                <input type="text" id="username" class="input-field" placeholder="Username" autocomplete="off">
                <button onclick="loginUser()" class="btn btn-primary">Enter</button>
                <small class="demo-text">Username wajib diisi</small>
            </div>
        </div>
    </div>

    <script>
        const splashWeb = document.getElementById('splashWeb');
        const splashDev = document.getElementById('splashDev');
        const loginPanel = document.getElementById('loginPanel');
        
        if (localStorage.getItem('jhon_user')) {
            window.location.href = 'dashboard.html';
        }
        
        setTimeout(() => {
            splashWeb.classList.add('fade-out');
            setTimeout(() => {
                splashWeb.classList.add('hidden');
                splashDev.classList.remove('hidden');
                splashDev.classList.add('fade-in');
                
                setTimeout(() => {
                    splashDev.classList.add('fade-out');
                    setTimeout(() => {
                        splashDev.classList.add('hidden');
                        loginPanel.classList.remove('hidden');
                        loginPanel.classList.add('fade-in');
                    }, 200);
                }, 2000);
            }, 200);
        }, 3000);
        
        function loginUser() {
            const username = document.getElementById('username').value.trim();
            if (!username) {
                alert('Username wajib diisi!');
                return;
            }
            localStorage.setItem('jhon_user', username);
            window.location.href = 'dashboard.html';
        }
    </script>
</body>
</html>
